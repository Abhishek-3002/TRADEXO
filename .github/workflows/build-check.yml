name: Project 521 build checks

on:
  push:
    branches:
      - main
      - rename-to-bizora
      - 'integration/**'
  pull_request:
    branches:
      - main
      - rename-to-bizora

permissions:
  contents: read

jobs:
  website-build:
    name: Website production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install website dependencies
        working-directory: website
        run: npm install
      - name: Build website
        working-directory: website
        run: npm run build

  desktop-check:
    name: Desktop build and database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Test offline database
        working-directory: desktop
        run: npm test
      - name: Build desktop renderer
        working-directory: desktop
        run: npm run build
